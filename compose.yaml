# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:${LIBSQL_VERSION:-latest}
    container_name: squelify_libsql
    hostname: libsql
    ports:
      - 5001:5001 # gRPC connection
      - 8080:8080 # user HTTP connection
      - 8081:8081 # admin HTTP connection
    volumes: ['libsql_data:/var/lib/sqld/data:rw']
    command: '/bin/sqld --enable-namespaces --enable-http-console --max-active-namespaces 2000'

  mailcrab:
    image: marlonb/mailcrab:${MAILCRAB_VERSION:-latest}
    container_name: squelify_mailcrab
    hostname: mailcrab
    ports:
      - 2525:1025 # port the SMTP server should be accessible on
      - 2580:1080 # port the web interface should be accessible on

  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-8-alpine}
    container_name: squelify_valkey
    hostname: valkey
    restart: always
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - VALKEY_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    ports:
      - 6379:6379
    volumes: ['valkey_data:/data:rw']
    ulimits:
      memlock: -1
      nofile:
        soft: 262144
        hard: 262144

  # @ref: https://github.com/versity/versitygw/wiki/Quickstart
  # export AWS_ACCESS_KEY_ID=myS3AccessKey
  # export AWS_SECRET_ACCESS_KEY=myS3SecretKey
  # export AWS_ENDPOINT_URL=http://127.0.0.1:7070
  # aws s3 mb s3://devbucket
  # aws s3 cp public/favicon.svg s3://devbucket/images/favicon.svg
  # aws --no-verify-ssl --endpoint-url http://127.0.0.1:7070 s3 ls s3://
  locals3:
    image: ghcr.io/versity/versitygw:latest
    container_name: squelify_s3
    restart: unless-stopped
    hostname: locals3
    ports:
      - 7070:7070
    volumes: ['./_data/s3_data:/srv:rw']
    command: --port 0.0.0.0:7070 posix /srv
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-myS3AccessKey}
      ROOT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-myS3SecretKey}

  localcdn:
    image: joseluisq/static-web-server:2
    container_name: squelify_cdn
    restart: unless-stopped
    ports:
      - 7080:80
      - 7443:443
    environment:
      SERVER_ROOT: /srv
      SERVER_DIRECTORY_LISTING: true
      SERVER_IGNORE_HIDDEN_FILES: true
    volumes: ['./_data/s3_data/devbucket:/srv:ro']

volumes:
  libsql_data:
    name: squelify_libsql_data
    driver: local
  valkey_data:
    driver: local
  s3_data:
    driver: local
